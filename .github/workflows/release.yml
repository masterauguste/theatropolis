name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: sh -n install.sh
      - run: sh tests/installer-release-tag.sh
      - run: sh tests/installer-master.sh
      - run: sh tests/installer-agent-token.sh
      - run: sh tests/installer-security.sh
      - run: shellcheck --shell=sh install.sh tests/*.sh
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/staging
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          for architecture in amd64 arm64; do
            rm -f dist/staging/theatropolis-master dist/staging/theatropolis-agent
            for component in master agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$architecture" go build \
                -trimpath \
                -ldflags="-s -w -buildid= -X main.version=$GITHUB_REF_NAME -X main.commit=$GITHUB_SHA -X main.buildDate=$build_date" \
                -o "dist/staging/theatropolis-$component" \
                "./cmd/theatropolis-$component"
            done
            tar \
              --sort=name \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --mtime="@$source_date_epoch" \
              -C dist/staging \
              -czf "dist/theatropolis_linux_${architecture}.tar.gz" \
              theatropolis-agent \
              theatropolis-master
          done
          (
            cd dist
            sha256sum theatropolis_linux_*.tar.gz > checksums.txt
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/theatropolis_linux_amd64.tar.gz
            dist/theatropolis_linux_arm64.tar.gz
            dist/checksums.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
