{{define "document-head"}}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{.Title}} · Theatropolis</title>
  <link rel="stylesheet" href="/assets/app.css?v={{.AssetVersion}}">
  <script src="/assets/dropdown.js?v={{.AssetVersion}}" defer></script>
</head>
{{end}}

{{define "membership-plan-fields"}}
<div class="membership-plan-fields">
  <label class="field"><span>Monthly traffic quota</span><select name="quota_mode" required><option value="unlimited"{{if eq .QuotaMode "unlimited"}} selected{{end}}>Unlimited</option><option value="limited"{{if eq .QuotaMode "limited"}} selected{{end}}>Set a monthly quota</option></select></label>
  <label class="field"><span>Quota (GiB)</span><input type="number" name="monthly_quota_gib" min="1" max="1000000" step="1" value="{{.QuotaGiB}}" placeholder="100"><small>Used when “Set a monthly quota” is selected.</small></label>
  <label class="field"><span>Subscription expiration</span><select name="expiration_mode" required><option value="none"{{if eq .ExpirationMode "none"}} selected{{end}}>No expiration</option><option value="months"{{if eq .ExpirationMode "months"}} selected{{end}}>Expire after a number of months</option></select></label>
  <label class="field"><span>Subscription months</span><input type="number" name="subscription_months" min="1" max="1200" step="1" value="{{.SubscriptionMonths}}"><small>Calendar months from today; access remains valid through the displayed end date.</small></label>
</div>
{{end}}

{{define "brand"}}
<a class="brand" href="/servers" aria-label="Theatropolis servers">
  <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 V8.5 Q12 4 19 8.5 V20"/><path d="M3 20 H21"/><path d="M5 8.5 Q8.5 11 12 8.5 Q15.5 11 19 8.5"/></svg></span>
  <strong>Theatropolis</strong>
</a>
{{end}}

{{define "global-header"}}
<header class="global-header">
  <div class="global-header__inner">
    {{template "brand" .}}
    <nav class="global-nav" aria-label="Primary navigation">
      <a href="/servers"{{if eq .ActiveNav "servers"}} class="is-active" aria-current="page"{{end}}>Servers</a>
      <a href="/proxy-nodes"{{if eq .ActiveNav "proxy-nodes"}} class="is-active" aria-current="page"{{end}}>Proxy Nodes</a>
      <a href="/users"{{if eq .ActiveNav "users"}} class="is-active" aria-current="page"{{end}}>Users</a>
      <a href="/settings"{{if eq .ActiveNav "settings"}} class="is-active" aria-current="page"{{end}}>Settings</a>
    </nav>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="button button--secondary button--small" type="submit">Sign out</button>
    </form>
  </div>
</header>
{{end}}
