{{define "document-head"}}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{.Title}} · Theatropolis</title>
  <link rel="stylesheet" href="/assets/app.css?v={{.AssetVersion}}">
  <script src="/assets/dropdown.js?v={{.AssetVersion}}" defer></script>
</head>
{{end}}

{{define "brand"}}
<a class="brand" href="/servers" aria-label="Theatropolis servers">
  <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 V8.5 Q12 4 19 8.5 V20"/><path d="M3 20 H21"/><path d="M5 8.5 Q8.5 11 12 8.5 Q15.5 11 19 8.5"/></svg></span>
  <strong>Theatropolis</strong>
</a>
{{end}}

{{define "global-header"}}
<header class="global-header">
  <div class="global-header__inner">
    {{template "brand" .}}
    <nav class="global-nav" aria-label="Primary navigation">
      <a href="/servers"{{if eq .ActiveNav "servers"}} class="is-active" aria-current="page"{{end}}>Servers</a>
      <a href="/pool"{{if eq .ActiveNav "pool"}} class="is-active" aria-current="page"{{end}}>Pool</a>
      <a href="/settings"{{if eq .ActiveNav "settings"}} class="is-active" aria-current="page"{{end}}>Settings</a>
    </nav>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="button button--secondary button--small" type="submit">Sign out</button>
    </form>
  </div>
</header>
{{end}}
