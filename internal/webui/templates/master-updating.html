{{define "master-updating.html"}}
<!doctype html>
<html lang="{{.Locale}}">
{{template "document-head" .}}
<body data-master-update-status-url="/settings/update-status?request_id={{.MasterUpdateRequestID}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{template "global-header" .}}
  <main class="main main--narrow" id="main">
    <section class="panel update-progress" aria-live="polite">
      <p class="eyebrow">Master update</p>
      <h1>Updating Theatropolis</h1>
      <p data-master-update-message>The verified release is being installed. This page will reconnect after the master restarts.</p>
      <div class="update-progress__bar" aria-hidden="true"><span></span></div>
      <code>{{.MasterUpdateRequestID}}</code>
      <a class="button button--secondary" href="/settings" hidden data-master-update-return>Return to settings</a>
    </section>
  </main>
  <script src="/assets/app.js?v={{.AssetVersion}}" defer></script>
</body>
</html>
{{end}}
